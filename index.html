<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Password Manager</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cpath d='M640 874.666667l-85.333333 85.333333h-85.333334l-85.333333-85.333333V448h256v170.666667l-42.666667 42.666666 42.666667 42.666667v42.666667l-42.666667 42.666666 42.666667 42.666667z' fill='%23FFA000'/%3E%3Cpath d='M810.666667 166.4c-10.666667-38.4-42.666667-66.133333-78.933334-76.8C680.533333 78.933333 601.6 64 512 64s-168.533333 14.933333-219.733333 25.6C256 100.266667 224 128 213.333333 166.4c-10.666667 36.266667-21.333333 87.466667-21.333333 142.933333 0 55.466667 10.666667 106.666667 21.333333 142.933334 10.666667 38.4 40.533333 66.133333 78.933334 74.666666 51.2 12.8 130.133333 27.733333 219.733333 27.733334s168.533333-14.933333 219.733333-25.6c38.4-8.533333 68.266667-38.4 78.933334-74.666667s21.333333-87.466667 21.333333-142.933333c0-57.6-10.666667-108.8-21.333333-145.066667zM618.666667 277.333333H405.333333c-23.466667 0-42.666667-19.2-42.666666-42.666666V192c0-12.8 66.133333-21.333333 149.333333-21.333333s149.333333 8.533333 149.333333 21.333333v42.666667c0 23.466667-19.2 42.666667-42.666666 42.666666z' fill='%23FFA000'/%3E%3Cpath d='M490.666667 554.666667h42.666666v405.333333h-42.666666z' fill='%23D68600'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --border-color: #e1e8ed;
            --th-bg: #f8fafc;
            --th-color: #4a5568;
            --code-bg: #edf2f7;
            --input-bg: #ffffff;
            --group-header-bg: #edf2f7;
            --group-header-hover: #e2e8f0;
            --group-row-bg: #fafafa;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border-color: #333333;
            --th-bg: #2d2d2d;
            --th-color: #a0aec0;
            --code-bg: #2a2a2a;
            --input-bg: #2a2a2a;
            --group-header-bg: #2a2a2a;
            --group-header-hover: #333333;
            --group-row-bg: #181818;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            transition: background-color 0.2s, color 0.2s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
            flex: 1;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .settings-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-toggle {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-toggle.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-danger {
            background-color: var(--danger);
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-export {
            background-color: #27ae60;
        }

        .btn-export:hover {
            background-color: #219150;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background-color: var(--border-color);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
            justify-content: flex-end;
            align-items: center;
        }

        input[type="text"], select {
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        #searchInput {
            width: 260px;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            table-layout: fixed;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background-color: var(--th-bg);
            font-weight: 600;
            color: var(--th-color);
        }

        .col-site { width: 22%; }
        .col-url { width: 22%; }
        .col-user { width: 18%; }
        .col-pass { width: 23%; }
        .col-action { width: 15%; text-align: right; }

        .site-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .site-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .favicon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            object-fit: contain;
            background-color: #eee;
            flex-shrink: 0;
        }

        .url-link {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--primary);
            text-decoration: none;
        }

        .url-link:hover {
            text-decoration: underline;
        }

        .group-domain-text {
            color: var(--text-color);
            font-weight: 600;
        }

        .password-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .password-toggle {
            cursor: pointer;
            user-select: none;
            font-family: monospace;
            background: var(--code-bg);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        tr.group-header {
            background-color: var(--group-header-bg);
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.15s;
        }

        tr.group-header:hover {
            background-color: var(--group-header-hover);
        }

        tr.group-row {
            background-color: var(--group-row-bg);
        }

        .child-indent {
            padding-left: 30px !important;
        }

        .arrow-icon {
            font-size: 12px;
            transition: transform 0.2s;
            display: inline-block;
        }

        .badge-count {
            background: var(--primary);
            color: white;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: normal;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* Footer Styles */
        footer {
            margin-top: 25px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .footer-info {
            max-width: 850px;
            line-height: 1.5;
        }

        .footer-info strong {
            color: var(--text-color);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            footer {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1 id="title">Менеджер Паролей CSV</h1>
        <div class="settings-controls">
            <button id="revealAllBtn" class="btn btn-toggle" style="display: none;">👁️ Показать пароли</button>
            <select id="langSelect">
                <option value="ru">RU</option>
                <option value="en">EN</option>
                <option value="ua">UA</option>
            </select>
            <button id="themeToggleBtn" class="btn-icon" title="Тема">🌙</button>
        </div>
    </div>
    
    <div class="top-bar">
        <div class="file-upload">
            <label for="csvFileInput" class="btn" id="lblUpload">
                📂 Загрузить CSV
            </label>
            <input type="file" id="csvFileInput" accept=".csv">
        </div>

        <div class="controls">
            <button id="toggleAllGroupsBtn" class="btn btn-toggle" style="display: none;">▲ Свернуть все</button>
            <button id="groupToggleBtn" class="btn btn-toggle" style="display: none;">📁 Группировать</button>
            
            <input type="text" id="searchInput" placeholder="Поиск..." disabled>
            
            <select id="sortSelect" disabled>
                <option value="default" id="optSortDefault">Без сортировки</option>
                <option value="title-asc" id="optSortTitleAsc">Название (А-Я)</option>
                <option value="title-desc" id="optSortTitleDesc">Название (Я-А)</option>
                <option value="url-asc" id="optSortUrlAsc">URL (А-Я)</option>
                <option value="url-desc" id="optSortUrlDesc">URL (Я-А)</option>
                <option value="user-asc" id="optSortUserAsc">Логин (А-Я)</option>
            </select>

            <button id="exportBtn" class="btn btn-export" style="display: none;">💾 Сохранить</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="passwordsTable" style="display: none;">
            <thead>
                <tr>
                    <th class="col-site" id="thSite">Сайт / Ресурс</th>
                    <th class="col-url">URL</th>
                    <th class="col-user" id="thUser">Логин / Email</th>
                    <th class="col-pass" id="thPass">Пароль</th>
                    <th class="col-action" id="thAction" style="text-align: right;">Действие</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        
        <div id="emptyState" class="empty-state">
            Загрузите CSV-файл с паролями.
        </div>
    </div>
</div>

<footer>
    <div class="footer-info">
        <div><strong id="footerPurposeTitle">Назначение:</strong> <span id="footerPurposeText">Удобный и безопасный просмотр, фильтрация, группировка и редактирование паролей из CSV-файлов прямо в браузере.</span></div>
    </div>
    <div class="footer-links">
        <a href="https://github.com/monkey52x/CSV-Password-Manager" target="_blank" rel="noopener">
            <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            GitHub Repository
        </a>
    </div>
</footer>

<script>
    let passwordsData = [];
    let isGrouped = false;
    let showAllPasswords = false;
    let collapsedGroups = {};
    let allGroupsCollapsed = false;

    const i18n = {
        ru: {
            title: "Менеджер Паролей CSV",
            upload: "📂 Загрузить CSV",
            groupBtn: "📁 Группировать",
            revealShow: "👁️ Показать пароли",
            revealHide: "🙈 Скрыть пароли",
            confirmReveal: "Вы действительно хотите показать все пароли на экране?",
            collapseAll: "▲ Свернуть все",
            expandAll: "▼ Развернуть все",
            searchPlaceholder: "Поиск по сайту или логину...",
            sortDefault: "Без сортировки",
            sortTitleAsc: "Название (А-Я)",
            sortTitleDesc: "Название (Я-А)",
            sortUrlAsc: "URL (А-Я)",
            sortUrlDesc: "URL (Я-А)",
            sortUserAsc: "Логин (А-Я)",
            saveCsv: "💾 Сохранить",
            thSite: "Сайт / Ресурс",
            thUrl: "URL",
            thUser: "Логин / Email",
            thPass: "Пароль",
            thAction: "Действие",
            deleteBtn: "Удалить",
            emptyState: "Загрузите CSV-файл с паролями.",
            footerPurposeTitle: "Назначение:",
            footerPurposeText: "Удобный и безопасный просмотр, фильтрация, группировка и редактирование паролей из CSV-файлов прямо в браузере."
        },
        en: {
            title: "CSV Password Manager",
            upload: "📂 Upload CSV",
            groupBtn: "📁 Group",
            revealShow: "👁️ Show Passwords",
            revealHide: "🙈 Hide Passwords",
            confirmReveal: "Are you sure you want to reveal all passwords on screen?",
            collapseAll: "▲ Collapse All",
            expandAll: "▼ Expand All",
            searchPlaceholder: "Search by site or login...",
            sortDefault: "No sorting",
            sortTitleAsc: "Title (A-Z)",
            sortTitleDesc: "Title (Z-A)",
            sortUrlAsc: "URL (A-Z)",
            sortUrlDesc: "URL (Z-A)",
            sortUserAsc: "Login (A-Z)",
            saveCsv: "💾 Save",
            thSite: "Site / Resource",
            thUrl: "URL",
            thUser: "Login / Email",
            thPass: "Password",
            thAction: "Action",
            deleteBtn: "Delete",
            emptyState: "Upload a CSV password file.",
            footerPurposeTitle: "Purpose:",
            footerPurposeText: "Convenient and secure viewing, filtering, grouping, and editing of CSV passwords entirely inside your browser."
        },
        ua: {
            title: "Менеджер Паролів CSV",
            upload: "📂 Завантажити CSV",
            groupBtn: "📁 Групувати",
            revealShow: "👁️ Показати паролі",
            revealHide: "🙈 Сховати паролі",
            confirmReveal: "Ви дійсно бажаєте показати всі паролі на екрані?",
            collapseAll: "▲ Згорнути все",
            expandAll: "▼ Розгорнути все",
            searchPlaceholder: "Пошук за сайтом або логіном...",
            sortDefault: "Без сортування",
            sortTitleAsc: "Назва (А-Я)",
            sortTitleDesc: "Назва (Я-А)",
            sortUrlAsc: "URL (А-Я)",
            sortUrlDesc: "URL (Я-А)",
            sortUserAsc: "Логін (А-Я)",
            saveCsv: "💾 Зберегти",
            thSite: "Сайт / Ресурс",
            thUrl: "URL",
            thUser: "Логін / Email",
            thPass: "Пароль",
            thAction: "Дія",
            deleteBtn: "Видалити",
            emptyState: "Завантажте CSV-файл із паролями.",
            footerPurposeTitle: "Призначення:",
            footerPurposeText: "Зручний та безпечний перегляд, фільтрація, групування та редагування паролів із CSV-файлів прямо в браузері."
        }
    };

    const fileInput = document.getElementById('csvFileInput');
    const table = document.getElementById('passwordsTable');
    const tableBody = document.getElementById('tableBody');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const exportBtn = document.getElementById('exportBtn');
    const groupToggleBtn = document.getElementById('groupToggleBtn');
    const toggleAllGroupsBtn = document.getElementById('toggleAllGroupsBtn');
    const revealAllBtn = document.getElementById('revealAllBtn');
    const langSelect = document.getElementById('langSelect');
    const themeToggleBtn = document.getElementById('themeToggleBtn');

    let currentLang = localStorage.getItem('app_lang') || 'ru';
    let currentTheme = localStorage.getItem('app_theme') || 'light';

    function initSettings() {
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggleBtn.innerText = currentTheme === 'dark' ? '☀️' : '🌙';

        if (!['ru', 'en', 'ua'].includes(currentLang)) {
            currentLang = 'ru';
        }

        langSelect.value = currentLang;
        applyLanguage(currentLang);
    }

    themeToggleBtn.addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        localStorage.setItem('app_theme', currentTheme);
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggleBtn.innerText = currentTheme === 'dark' ? '☀️' : '🌙';
    });

    langSelect.addEventListener('change', (e) => {
        currentLang = e.target.value;
        localStorage.setItem('app_lang', currentLang);
        applyLanguage(currentLang);
    });

    groupToggleBtn.addEventListener('click', () => {
        isGrouped = !isGrouped;
        groupToggleBtn.classList.toggle('active', isGrouped);
        toggleAllGroupsBtn.style.display = isGrouped ? 'inline-flex' : 'none';
        renderTable();
    });

    revealAllBtn.addEventListener('click', () => {
        const t = i18n[currentLang] || i18n.ru;
        if (!showAllPasswords) {
            if (confirm(t.confirmReveal)) {
                showAllPasswords = true;
                revealAllBtn.classList.add('active');
                revealAllBtn.innerText = t.revealHide;
                renderTable();
            }
        } else {
            showAllPasswords = false;
            revealAllBtn.classList.remove('active');
            revealAllBtn.innerText = t.revealShow;
            renderTable();
        }
    });

    toggleAllGroupsBtn.addEventListener('click', () => {
        const t = i18n[currentLang] || i18n.ru;
        allGroupsCollapsed = !allGroupsCollapsed;

        const domains = [...new Set(passwordsData.map(item => extractBaseDomain(item.url)))];
        domains.forEach(domain => {
            collapsedGroups[domain] = allGroupsCollapsed;
        });

        toggleAllGroupsBtn.innerText = allGroupsCollapsed ? t.expandAll : t.collapseAll;
        renderTable();
    });

    function applyLanguage(lang) {
        const t = i18n[lang] || i18n.ru;
        document.getElementById('title').innerText = t.title;
        document.getElementById('lblUpload').innerText = t.upload;
        groupToggleBtn.innerText = t.groupBtn;
        revealAllBtn.innerText = showAllPasswords ? t.revealHide : t.revealShow;
        toggleAllGroupsBtn.innerText = allGroupsCollapsed ? t.expandAll : t.collapseAll;
        searchInput.placeholder = t.searchPlaceholder;
        document.getElementById('optSortDefault').innerText = t.sortDefault;
        document.getElementById('optSortTitleAsc').innerText = t.sortTitleAsc;
        document.getElementById('optSortTitleDesc').innerText = t.sortTitleDesc;
        document.getElementById('optSortUrlAsc').innerText = t.sortUrlAsc;
        document.getElementById('optSortUrlDesc').innerText = t.sortUrlDesc;
        document.getElementById('optSortUserAsc').innerText = t.sortUserAsc;
        exportBtn.innerText = t.saveCsv;
        document.getElementById('thSite').innerText = t.thSite;
        document.getElementById('thUser').innerText = t.thUser;
        document.getElementById('thPass').innerText = t.thPass;
        document.getElementById('thAction').innerText = t.thAction;
        emptyState.innerText = t.emptyState;
        
        document.getElementById('footerPurposeTitle').innerText = t.footerPurposeTitle;
        document.getElementById('footerPurposeText').innerText = t.footerPurposeText;

        renderTable();
    }

    fileInput.addEventListener('change', handleFileUpload);
    searchInput.addEventListener('input', renderTable);
    sortSelect.addEventListener('change', renderTable);
    exportBtn.addEventListener('click', exportToCSV);

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            parseCSV(event.target.result);
        };
        reader.readAsText(file);
    }

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        if (lines.length < 2) return;

        passwordsData = [];
        const headers = parseCSVLine(lines[0].toLowerCase());
        
        let titleIdx = headers.findIndex(h => h.includes('name') || h.includes('title') || h.includes('название') || h.includes('назва') || h.includes('сайт'));
        let urlIdx = headers.findIndex(h => h.includes('url') || h.includes('link') || h.includes('ссылка') || h.includes('посилання'));
        let userIdx = headers.findIndex(h => h.includes('username') || h.includes('login') || h.includes('user') || h.includes('логин') || h.includes('логін'));
        let passIdx = headers.findIndex(h => h.includes('password') || h.includes('pass') || h.includes('пароль'));

        if (urlIdx === -1) urlIdx = 1;
        if (userIdx === -1) userIdx = 2;
        if (passIdx === -1) passIdx = 3;
        if (titleIdx === -1) titleIdx = 0;

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const row = parseCSVLine(lines[i]);
            
            const url = row[urlIdx] || '';
            const title = row[titleIdx] || extractDomain(url) || 'Без названия';
            const username = row[userIdx] || '';
            const password = row[passIdx] || '';

            passwordsData.push({ id: Date.now() + Math.random(), title, url, username, password });
        }

        searchInput.disabled = false;
        sortSelect.disabled = false;
        exportBtn.style.display = 'inline-flex';
        groupToggleBtn.style.display = 'inline-flex';
        revealAllBtn.style.display = 'inline-flex';
        toggleAllGroupsBtn.style.display = isGrouped ? 'inline-flex' : 'none';
        table.style.display = 'table';
        emptyState.style.display = 'none';

        renderTable();
    }

    function parseCSVLine(line) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') {
                inQuotes = !inQuotes;
            } else if (c === ',' && !inQuotes) {
                result.push(cur.trim().replace(/^"|"$/g, ''));
                cur = '';
            } else {
                cur += c;
            }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    function extractBaseDomain(url) {
        if (!url) return 'others';
        try {
            let parsed = new URL(url.startsWith('http') ? url : 'http://' + url);
            let hostname = parsed.hostname.replace('www.', '');

            const ipRegex = /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/;
            if (ipRegex.test(hostname)) {
                return hostname;
            }

            let parts = hostname.split('.');
            if (parts.length >= 2) {
                return parts.slice(-2).join('.');
            }
            return parts[0] || 'others';
        } catch {
            return url.split('/')[0] || 'others';
        }
    }

    function extractDomain(url) {
        if (!url) return '';
        try {
            let parsed = new URL(url.startsWith('http') ? url : 'http://' + url);
            return parsed.hostname.replace('www.', '');
        } catch {
            return url.split('/')[0];
        }
    }

    function getFaviconUrl(url) {
        const domain = extractBaseDomain(url);
        if (!domain || domain === 'others') return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌐</text></svg>';
        return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
    }

    function renderTable() {
        const t = i18n[currentLang] || i18n.ru;
        const query = searchInput.value.toLowerCase();
        let filtered = passwordsData.filter(item => 
            item.title.toLowerCase().includes(query) ||
            item.url.toLowerCase().includes(query) ||
            item.username.toLowerCase().includes(query)
        );

        const sortVal = sortSelect.value;
        filtered.sort((a, b) => {
            if (sortVal === 'title-asc') return a.title.localeCompare(b.title);
            if (sortVal === 'title-desc') return b.title.localeCompare(a.title);
            if (sortVal === 'url-asc') return a.url.localeCompare(b.url);
            if (sortVal === 'url-desc') return b.url.localeCompare(a.url);
            if (sortVal === 'user-asc') return a.username.localeCompare(b.username);
            return 0;
        });

        tableBody.innerHTML = '';

        if (isGrouped) {
            const groups = {};
            filtered.forEach(item => {
                const domain = extractBaseDomain(item.url);
                if (!groups[domain]) groups[domain] = [];
                groups[domain].push(item);
            });

            Object.keys(groups).forEach(domain => {
                const items = groups[domain];
                const isCollapsed = collapsedGroups[domain] || false;
                const mainTitle = items[0].title || domain;

                const headerTr = document.createElement('tr');
                headerTr.className = 'group-header';
                headerTr.innerHTML = `
                    <td>
                        <div class="site-cell">
                            <img class="favicon" src="${getFaviconUrl(domain)}" onerror="this.src='data:image/svg+xml,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 100 100&quot;><text y=&quot;.9em&quot; font-size=&quot;90&quot;>🌐</text></svg>'" alt="">
                            <strong class="site-title">${escapeHtml(mainTitle)}</strong>
                            <span class="badge-count">${items.length}</span>
                        </div>
                    </td>
                    <td><span class="group-domain-text">${escapeHtml(domain)}</span></td>
                    <td></td>
                    <td></td>
                    <td style="text-align: right;">
                        <span class="arrow-icon">${isCollapsed ? '▲' : '▼'}</span>
                    </td>
                `;

                headerTr.addEventListener('click', () => {
                    collapsedGroups[domain] = !collapsedGroups[domain];
                    renderTable();
                });

                tableBody.appendChild(headerTr);

                if (!isCollapsed) {
                    items.forEach(item => {
                        const tr = createRow(item, t, true);
                        tableBody.appendChild(tr);
                    });
                }
            });
        } else {
            filtered.forEach(item => {
                const tr = createRow(item, t, false);
                tableBody.appendChild(tr);
            });
        }
    }

    function createRow(item, t, isChild = false) {
        const tr = document.createElement('tr');
        if (isChild) tr.className = 'group-row';

        const fullUrl = item.url ? (item.url.startsWith('http') ? item.url : 'http://' + item.url) : '#';
        const displayPassword = showAllPasswords ? escapeHtml(item.password) : '••••••••';

        tr.innerHTML = `
            <td class="${isChild ? 'child-indent' : ''}">
                <div class="site-cell">
                    ${!isChild ? `<img class="favicon" src="${getFaviconUrl(item.url)}" onerror="this.src='data:image/svg+xml,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 100 100&quot;><text y=&quot;.9em&quot; font-size=&quot;90&quot;>🌐</text></svg>'" alt="">` : ''}
                    <strong class="site-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</strong>
                </div>
            </td>
            <td>
                <a href="${escapeHtml(fullUrl)}" target="_blank" rel="noopener" class="url-link" title="${escapeHtml(item.url)}">${escapeHtml(item.url)}</a>
            </td>
            <td title="${escapeHtml(item.username)}">${escapeHtml(item.username)}</td>
            <td>
                <div class="password-container">
                    <span class="password-toggle" data-password="${escapeHtml(item.password)}">${displayPassword}</span>
                    <button class="btn-icon btn-copy-pass" title="Copy password">📋</button>
                </div>
            </td>
            <td style="text-align: right;">
                <button class="btn btn-danger btn-delete">${t.deleteBtn}</button>
            </td>
        `;

        const passToggle = tr.querySelector('.password-toggle');
        passToggle.addEventListener('click', function() {
            if (this.innerText === '••••••••') {
                this.innerText = this.getAttribute('data-password');
            } else {
                this.innerText = '••••••••';
            }
        });

        const copyBtn = tr.querySelector('.btn-copy-pass');
        copyBtn.addEventListener('click', function() {
            navigator.clipboard.writeText(item.password).then(() => {
                const originalText = this.innerText;
                this.innerText = '✓';
                setTimeout(() => {
                    this.innerText = originalText;
                }, 1200);
            });
        });

        const deleteBtn = tr.querySelector('.btn-delete');
        deleteBtn.addEventListener('click', function() {
            deleteRow(item.id);
        });

        return tr;
    }

    function deleteRow(id) {
        passwordsData = passwordsData.filter(item => item.id !== id);
        renderTable();
    }

    function escapeHtml(text) {
        return String(text || '')
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function exportToCSV() {
        if (passwordsData.length === 0) return;

        let csvContent = "name,url,username,password\n";
        
        passwordsData.forEach(row => {
            let line = `"${row.title.replace(/"/g, '""')}","${row.url.replace(/"/g, '""')}","${row.username.replace(/"/g, '""')}","${row.password.replace(/"/g, '""')}"`;
            csvContent += line + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "passwords_updated.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    initSettings();
</script>

</body>
</html>
